name: build and test

# Runs on every push to every branch (start, ex4-solution, broken-jump, ...).
# A red cross here means the starter is broken: fix it before class.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings are errors)
        run: dotnet build -warnaserror
      - name: Test
        run: dotnet test --no-build
